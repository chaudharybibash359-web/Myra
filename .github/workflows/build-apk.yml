name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_VER"
          
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Active Java major version could not be detected." >&2
            exit 1
          fi
          
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer. Found: $JAVA_VER" >&2
            exit 1
          fi
          echo "Java version check passed ($JAVA_VER >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Generating temporary ./debug.keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore." >&2
            exit 1
          fi
          echo "./debug.keystore verified successfully."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected APK not found at $APK_PATH" >&2
            echo "Discovered APKs inside app/build/outputs/apk:" >&2
            find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk" || true
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "Error: $APK_PATH is empty." >&2
            exit 1
          fi

          case "$APK_PATH" in
            *.apk) ;;
            *) echo "Error: $APK_PATH does not have .apk extension." >&2; exit 1 ;;
          esac

          echo "APK verified successfully: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          TEMP_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "$TEMP_DIR/app-debug.apk"
          
          RELEASE_ASSET="$TEMP_DIR/app-debug.apk"
          if [ ! -f "$RELEASE_ASSET" ] || [ ! -s "$RELEASE_ASSET" ]; then
            echo "Error: Release asset preparation failed." >&2
            exit 1
          fi
          
          echo "Prepared release asset: $RELEASE_ASSET"
          echo "asset_path=$RELEASE_ASSET" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Prepared APK does not exist at $ASSET_PATH" >&2
            exit 1
          fi
          
          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared APK is empty." >&2
            exit 1
          fi
          
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Asset does not end in .apk." >&2; exit 1 ;;
          esac
          
          ASSET_NAME=$(basename "$ASSET_PATH")
          if [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "Error: Asset filename is not app-debug.apk (found $ASSET_NAME)." >&2
            exit 1
          fi
          
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          
          NOTES=$(cat <<EOF
          ### Automatically Generated Debug APK
          - **Build System**: Built by GitHub Actions
          - **Run Number**: ${GITHUB_RUN_NUMBER}
          - **Run Attempt**: ${GITHUB_RUN_ATTEMPT}
          - **Source Commit**: ${GITHUB_SHA}
          
          > **Note**: This APK is intended for testing purposes only. It is signed with a temporary debug keystore and is not intended for Google Play production deployment.
          EOF
          )
          
          echo "Creating release $RELEASE_TAG for commit $GITHUB_SHA..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          
          echo "=== APK BUILD & RELEASE REPORT ==="
          echo "Release Outcome: $RELEASE_OUTCOME"
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            RELEASE_VIEW=$(gh release view "$RELEASE_TAG" --json tagName,title,url)
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release Info: $RELEASE_VIEW"
            echo "APK Filename: app-debug.apk"
            
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "Direct Download URL: $DIRECT_URL"
            
            echo "### DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "[$DIRECT_URL]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The normal Actions artifact \`app-debug-apk\` remains available as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: Release publishing was not completed."
            if [ -f "$APK_PATH" ] && [ -s "$APK_PATH" ]; then
              echo "The debug APK was built successfully and the Actions artifact \`app-debug-apk\` remains available for download."
            fi
          fi
